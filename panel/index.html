<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Panel de ventas · AECODE Stand</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0B0B14" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23191C32'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%237C28F8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="panel.css" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <section id="view-login" class="screen">
    <div class="login card">
      <div class="brand">AECODE · Panel de ventas</div>
      <h1>Ingresa al stand</h1>
      <p class="muted">Escribe tu nombre y la contraseña del panel. Varios pueden entrar a la vez.</p>

      <label class="field">
        <span>Tu nombre (vendedor)</span>
        <input id="in-vendedor" type="text" autocomplete="name" placeholder="Ej. Jessica" />
      </label>
      <label class="field">
        <span>Contraseña del panel</span>
        <input id="in-key" type="password" autocomplete="current-password" placeholder="••••••••" />
      </label>

      <p id="login-error" class="error" hidden></p>
      <button id="btn-login" class="btn btn--primary">Entrar</button>
    </div>
  </section>

  <!-- ============ PANEL ============ -->
  <section id="view-panel" class="screen" hidden>
    <header class="topbar">
      <div class="topbar__left">
        <span class="topbar__title">Cola de premios</span>
        <span id="conn" class="dot" title="Conexión">•</span>
      </div>
      <div class="topbar__right">
        <span id="me" class="chip"></span>
        <button id="btn-logout" class="linkbtn">Salir</button>
      </div>
    </header>

    <div class="statusbar">
      <span id="pend-count" class="badge badge--live">0 en espera</span>
      <span id="last-upd" class="muted small">actualizando…</span>
    </div>

    <main class="feed">
      <div id="pendientes"></div>

      <details id="recientes-wrap" class="recientes">
        <summary>Últimos premiados</summary>
        <div id="recientes"></div>
      </details>
    </main>
  </section>

  <!-- ============ MODAL: asignar premio ============ -->
  <div id="modal" class="modal" hidden>
    <div class="modal__box card">
      <button id="modal-close" class="modal__x" aria-label="Cerrar">✕</button>
      <div class="modal__person">
        <h2 id="m-nombre">Nombre</h2>
        <div id="m-meta" class="muted small"></div>
        <div id="m-interes" class="interes-list"></div>
      </div>

      <div class="modal__label">¿Qué premio ganó en la ruleta?</div>
      <div id="premios" class="premios"></div>

      <p id="modal-error" class="error" hidden></p>
      <div class="modal__actions">
        <button id="btn-confirm" class="btn btn--primary" disabled>Confirmar y enviar correo</button>
      </div>
      <p class="muted small center">Al confirmar, recién le llega el correo a la persona.</p>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="panel.js"></script>
</body>
</html>
